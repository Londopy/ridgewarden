name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# the changelog has its own workflow (changelog.yml)

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    # the agent runs on Linux (Pi or any small box), so that's where it gets tested
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # includes tests/partition.rs, the M1 "zero lost events" acceptance test
        run: cargo test --workspace

  static:
    name: Static build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross provides the musl C toolchain that bundled SQLite needs, for both arches
      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p ridgewarden

      - name: Check it is static
        run: |
          f=target/${{ matrix.target }}/release/ridgewarden
          file "$f"
          file "$f" | grep -Eq 'statically linked|static-pie linked'
          ls -l "$f"
