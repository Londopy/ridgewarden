[workspace]
members = [".", "crates/ridgewarden-client", "crates/ridgewarden-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Londopy"]
repository = "https://github.com/Londopy/ridgewarden"
homepage = "https://github.com/Londopy/ridgewarden"
rust-version = "1.88"

[package]
name = "ridgewarden"
version = "0.2.0"
description = "LAN-side edge agent for AREDN meshes: link history, service health and a signed, partition-tolerant event log"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "ridgewarden"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
blake3 = "1.8.7"
clap = { version = "4.6.8", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
ridgewarden-client = { version = "0.2.0", path = "crates/ridgewarden-client", features = ["tui"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.45", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
