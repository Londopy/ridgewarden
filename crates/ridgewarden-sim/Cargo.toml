[package]
name = "ridgewarden-sim"
version = "0.1.0"
description = "Fake AREDN mesh for testing ridgewarden without touching real nodes"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.2.1"
